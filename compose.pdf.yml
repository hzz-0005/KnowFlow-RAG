# Enable the structured PDF path: docker compose -f compose.yml -f compose.pdf.yml up -d
services:
  api:
    environment:
      PDF_PARSER: docling
      DOCLING_BASE_URL: http://docling:5001
      DOCLING_TIMEOUT_SECONDS: "600"
    depends_on:
      docling:
        condition: service_healthy
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu@sha256:8ff0fd9379a7ec85c2508274dfbaa44e5afb730d38096bf56d95a1338289738d
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_MAX_NUM_PAGES: "150"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "600"
      DOCLING_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
