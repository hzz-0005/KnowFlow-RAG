name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install, test and build
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test && pnpm build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: knowflow
          POSTGRES_USER: knowflow
          POSTGRES_PASSWORD: knowflow
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U knowflow -d knowflow"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://knowflow:knowflow@localhost:5433/knowflow
      APP_ENV: test
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra dev
      - name: Lint shipped runtime and release tools
        run: uv run --locked --extra dev ruff check backend migrations scripts
      - name: Unit and disposable PostgreSQL integration tests
        run: uv run --locked --extra dev python scripts/run_tests.py -q -rs
      - name: Check source export policy
        run: |
          python scripts/prepare_release.py --out "$RUNNER_TEMP/source-export"
          python scripts/check_release.py --root "$RUNNER_TEMP/source-export/knowflow-rag" --out "$RUNNER_TEMP/release-check.json"
