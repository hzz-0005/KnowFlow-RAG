server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Backend enforces MAX_UPLOAD_MB (up to 200); allow multipart overhead here.
    client_max_body_size 201m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8000/api/;
        # Interactive queries have a 180 s application deadline, including review.
        # Keep the proxy alive long enough to return the application's final status.
        proxy_read_timeout 210s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location = /docs {
        proxy_pass http://api:8000/docs;
    }

    location /docs/ {
        proxy_pass http://api:8000/docs/;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
